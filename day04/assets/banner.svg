<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Day 04 · Stack Analysis Studio on the web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#f5f3ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5f3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="200" rx="22" fill="url(#bg)"/>
  <rect width="900" height="200" rx="22" fill="url(#glow)"/>
  <!-- stacked slices motif -->
