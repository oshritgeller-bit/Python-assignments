    <rect x="16" y="14" width="120" height="80" rx="10" stroke-opacity="0.6"/>
    <rect x="32" y="28" width="120" height="80" rx="10" fill="#4c1d95" fill-opacity="0.55"/>
    <circle cx="70" cy="60" r="9" fill="#c4b5fd" stroke="none"/>
    <circle cx="105" cy="78" r="13" fill="#e9d5ff" stroke="none"/>
    <circle cx="124" cy="52" r="6" fill="#a78bfa" stroke="none"/>
  </g>
  <text x="48" y="74" fill="#ddd6fe" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4">DAY 04 · WIS PYTHON COURSE</text>
  <text x="48" y="122" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700">Stack Analysis Studio</text>
  <text x="48" y="160" fill="#ede9fe" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">now on the web, with Flask</text>
